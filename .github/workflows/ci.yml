name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest   # 센터 운영 PC 환경
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q jeju_agent app.py scripts tests

      - name: Environment doctor (offline)
        run: python -m jeju_agent.cli doctor --offline

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      # 설치 스크립트를 실제로 실행해 문법 오류와 .env 덮어쓰기 같은 실수를 잡는다.
      - name: setup.bat smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.bat < NUL
          if errorlevel 1 exit /b 1
          if not exist .venv\Scripts\python.exe exit /b 1
          fc /b .env .env.example

      - name: setup.sh smoke test (Linux)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          bash setup.sh
          test -x .venv/bin/python
          cmp .env .env.example
