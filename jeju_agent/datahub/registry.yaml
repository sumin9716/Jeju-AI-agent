# ──────────────────────────────────────────────────────────────────────────────
# 데이터 레지스트리: 에이전트가 바로 불러올 수 있도록 미리 등록한 제주데이터허브 데이터셋.
#
#  - catalog_no : 「제주데이터허브 데이터 목록_20261105」의 No. (data/catalog/*.csv)
#  - access     : api(Open API) | file(허브에서 파일 다운로드) | link(외부 링크)
#  - api_id     : 제주데이터허브 데이터 상세 페이지 > "API" 탭에 표시되는 고유 ID.
#                 허브 로그인 → 마이페이지 → 프로젝트 생성/API 신청 후 확인해 채워 넣는다.
#                 (프로젝트 키는 .env 의 JEJUDATAHUB_PROJECT_KEY 에 넣는다)
#  - api_params : 호출 시 기본으로 붙일 질의 변수. {{today}}, {{today-90d}} 같은 날짜 치환 가능.
#  - file_glob  : data/raw/ 에서 찾을 파일 이름 패턴 (CSV/XLSX). 허브에서 내려받아 저장하면 자동 인식.
#  - sample_file: data/samples/ 의 합성 샘플 (scripts/make_samples.py 로 생성). 실제 데이터가 아니다.
#  - columns    : 샘플/정규화 기준 컬럼. 실제 API 응답 키가 다르면 rename 으로 맞춘다.
#  - schema_verified: 실제 응답 스키마를 확인했는지 여부(false 면 공개 명세 기반 추정).
# ──────────────────────────────────────────────────────────────────────────────
version: 1
datasets:
  - id: floating_population_emd
    catalog_no: 753
    name: 읍면동 단위 내국인 유동인구
    category: 인구, 생활
    provider: 제주특별자치도 (제주데이터허브)
    source_url: https://www.jejudatahub.net
    access: api
    api_id: "Daaa1t3at3tt8a8DD3t55538t35Dab1t"
    # 기간 변수는 필수다(없으면 HTTP 400). YYYYMMDD 와 YYYY-MM-DD 모두 받는다. 쪽당 최대 100건(limit>100 은 HTTP 500).
    # 기본 기간에 데이터가 없으면 로더가 가장 최근 데이터 날짜를 찾아 그 기준 최근 2주로 다시 불러온다. (2026-11-07 실호출로 확인)
    api_params:
      startDate: "{{today-21d}}"
      endDate: "{{today-8d}}"
    date_params: [startDate, endDate]
    # 응답 컬럼 이름 그대로 질의 변수로 넣으면 걸러진다 (2026-11-07 check-api --deep 로 확인:
    # 2026-08-25~31 전체 4,816건 → emd=한림읍 112건, city=제주시 2,912건, gender=남 2,408건, ageGroup=10대 602건)
    filter_params:
      emd: 읍면동 이름 (예 애월읍, 노형동). 한 곳만 받으면 하루 16건으로 줄어 1년치도 빠르다
      city: 시군구 (제주시 또는 서귀포시)
      gender: 성별 (남 또는 여)
      ageGroup: 연령대 (예 10대, 20대)
    file_glob: "*유동인구*.csv;*유동인구*.xlsx;floating_population*.csv"
    sample_file: floating_population_emd_sample.csv
    update: "2017-01-01 ~ (일 단위 자동갱신)"
    license: 제주데이터허브 이용약관 (출처 표시 후 자유 이용, 상세 조건은 데이터 상세 페이지 확인)
    schema_verified: true
    columns:
      - {name: 날짜, dtype: date, desc: 기준 일자 (baseDate)}
      - {name: 시군구, dtype: str, desc: 제주시/서귀포시 (city)}
      - {name: 읍면동, dtype: str, desc: 행정 읍면동명 (emd)}
      - {name: 성별, dtype: str, desc: 남/여 (gender)}
      - {name: 연령대, dtype: str, desc: 10대 등 (ageGroup)}
      - {name: 거주인구, dtype: int, desc: 해당 읍면동 거주 내국인 추정치 (resdPop)}
      - {name: 근무인구, dtype: int, desc: 해당 읍면동 근무 내국인 추정치 (workPop)}
      - {name: 방문자수, dtype: int, desc: 거주·근무 외 방문 내국인 추정치 (visitPop)}
    # 실제 응답 컬럼 (2026-11-07 check-api 로 확인)
    rename:
      baseDate: 날짜
      city: 시군구
      emd: 읍면동
      gender: 성별
      ageGroup: 연령대
      resdPop: 거주인구
      workPop: 근무인구
      visitPop: 방문자수
    notes: >-
      Open API 필수 질의 변수는 startDate·endDate(YYYYMMDD)이다. 하루 약 688건(읍면동 43곳 × 성별 2 × 연령대 8로 추정)이고
      쪽당 최대 100건이라 1개월이면 약 210회 호출이 필요하므로, 한 번에 1개월 이내로 요청하고 더 길면 나눠 부른다.
      허브 데이터는 늦게 올라온다(2026-11-07 확인 시 가장 최근 날짜 2026-08-31, 약 2개월 지연). "최근" 질문은 오늘이 아니라
      가장 최근 데이터 날짜를 기준으로 기간을 잡고, 답변에 실제 데이터 기간을 밝힌다. 통신사 기반 추정치이며 값이 실제 주민 수보다 훨씬 크게 나타난다
      (예: 2024-01-01 애월읍 30대 남성 거주인구 37,074). 시간대별 추정치를 합산한 값일 수 있으므로 절대 인원으로 말하지 말고
      지역·요일·기간 간 상대 비교와 추세로 해석한다.

  - id: bus_stop_daily_users
