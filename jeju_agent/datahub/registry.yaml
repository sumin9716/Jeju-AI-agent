      stationType: 정류소유형
      stationName: 정류소명
      stationAddress: 정류소주소
      localInfo: 지역정보
      direction: 방향
      latitude: 위도
      longitude: 경도
    notes: >-
      정류소 좌표와 주소(전체 4,352곳, 44회 호출). 같은 이름의 정류소가 방향별로 여러 개 있을 수 있다. 읍면동 컬럼은 따로 없으니
      정류소주소(예 '서귀포시 표선면 세화리')의 두 번째 단어로 읍면동을 구한다. 이름 하나만 볼 때는 stationName 으로 거른다
      (전체 이름 일치). 2026-11-07 사용자 PC 의 check-api --deep 으로 실제 응답을 확인했다.

  - id: daily_weather
    catalog_no: 756
    name: 일별 기상 정보
    category: 환경, 재난
    provider: 제주특별자치도 (제주데이터허브, 원자료 기상청)
    source_url: https://www.jejudatahub.net
    access: api
    api_id: 1aD5taat1attaa51Db1511b51ab9Da19
    api_params:
      startDate: "20250317"
      endDate: "20250330"
    date_params: [startDate, endDate]
    day_param: searchDate
    api_paging: {max_days: 400}
    filter_params:
      observatoryName: 관측소 이름 (예 제주, 중문)
    file_glob: "*기상*.csv;*기상*.xlsx;daily_weather*.csv"
    sample_file: daily_weather_sample.csv
    update: "2014-01-01 ~ 2025-03-30 (2026-11-07 확인, 이후 갱신 멈춤)"
    license: 제주데이터허브 이용약관 (출처 표시)
    schema_verified: false
    columns:
      - {name: 날짜, dtype: date, desc: baseDate}
      - {name: 관측소명, dtype: str, desc: "observatoryName (예 오등, 중문)"}
      - {name: 평균기온, dtype: float, desc: ℃}
      - {name: 최고기온, dtype: float, desc: ℃}
      - {name: 최고기온시각, dtype: str, desc: HHMM}
      - {name: 최저기온, dtype: float, desc: ℃}
      - {name: 최저기온시각, dtype: str, desc: HHMM}
      - {name: 강수량, dtype: float, desc: 일 강수량 mm (dailyRainfall)}
      - {name: 평균풍속, dtype: float, desc: m/s}
      - {name: 최대풍속, dtype: float, desc: m/s}
      - {name: 최대풍속시각, dtype: str, desc: HHMM}
      - {name: 최대풍속방향, dtype: str}
    rename:
      baseDate: 날짜
      observatoryName: 관측소명
      averageTemperature: 평균기온
      highestTemperature: 최고기온
      highestTemperatureTime: 최고기온시각
      lowestTemperature: 최저기온
      lowestTemperatureTime: 최저기온시각
      dailyRainfall: 강수량
      averageWindSpeed: 평균풍속
      maximumWindSpeed: 최대풍속
      maximumWindSpeedTime: 최대풍속시각
      maximumWindSpeedDirection: 최대풍속방향
    notes: >-
      API 는 하루짜리 searchDate(YYYYMMDD)만 받으므로 기간은 하루씩 나눠 부른다(1년이면 약 365회 호출로 수 분 걸림).
      하루에 관측소마다 1행이다. 관측소별 값이므로 정류소·읍면동과 결합할 때는 기상관측소 정보(weather_stations, No.757)의
      좌표로 가장 가까운 관측소를 고른다. 실제 자료는 2025-03-30 에서 갱신이 멈췄다(2026-11-07 사용자 PC 점검, 그날 관측소 33곳).
      그래서 날씨와 다른 데이터를 결합할 때는 2025-03-30 이전 기간을 고르고, 그 이후 기간을 물으면 실제 날씨가 없다는 점을 먼저 밝힌다.
      observatoryName 으로 한 관측소만 받을 수 있다. 일별 자료에는 33곳만 있고 '제주' 관측소는 없다(관측소 정보 42곳과 다름,
      2026-11-07 실데이터 분석에서 확인). 제주시 쪽은 좌표로 가장 가까운 관측소(예 오등, 제주시청에서 약 4.7km)를 쓰고 밝힌다.
      관측소 이름이 확실하지 않으면 먼저 하루치를 거르지 않고 받아 이름을 확인한다.

