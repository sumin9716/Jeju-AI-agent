    access: api
    api_id: ""
    api_params: {}
    file_glob: "*정류소별*이용자*.csv;*정류소별*.xlsx;bus_stop_daily*.csv"
    sample_file: bus_stop_daily_users_sample.csv
    update: "2015-01-01 ~ (일 단위 자동갱신)"
    license: 제주데이터허브 이용약관 (출처 표시)
    schema_verified: false
    columns:
      - {name: 날짜, dtype: date, desc: 기준 일자}
      - {name: 정류소ID, dtype: str, desc: 버스 정류소 고유 ID}
      - {name: 정류소명, dtype: str}
      - {name: 읍면동, dtype: str, desc: 정류소가 위치한 읍면동}
      - {name: 승차인원, dtype: int, desc: 교통카드 기준 승차 인원}
      - {name: 하차인원, dtype: int, desc: 교통카드 기준 하차 인원}
    rename:
      baseDate: 날짜
      date: 날짜
      stationId: 정류소ID
      stopId: 정류소ID
      stationNm: 정류소명
      stopName: 정류소명
      emdNm: 읍면동
      rideCnt: 승차인원
      boardCnt: 승차인원
      alightCnt: 하차인원
      getoffCnt: 하차인원
    notes: 현금 승차는 집계되지 않을 수 있다. 정류소 기본 정보(No.726)와 정류소ID로 결합해 좌표를 얻을 수 있다.

  - id: bus_route_daily_users
    catalog_no: 724
    name: 일일 노선별 버스 이용자 정보
    category: 교통, 안전
    provider: 제주특별자치도 (제주데이터허브)
    source_url: https://www.jejudatahub.net
    access: api
    api_id: 1t4tbb16b4t1t11tt11tDt1ab6114a1t
    api_params:
      startDate: "{{today-9d}}"
      endDate: "{{today-3d}}"
    date_params: [startDate, endDate]
    filter_params:
      moveType: 승차 또는 환승 (승차만 받으면 약 3/4 로 줄어듦)
      priceType: 요금 구분 (예 일반)
    file_glob: "*노선별*이용자*.csv;*노선별*.xlsx;bus_route_daily*.csv"
    sample_file: bus_route_daily_users_sample.csv
    update: "2015-01-01 ~ (일 단위 자동갱신, 약 2일 지연)"
    license: 제주데이터허브 이용약관 (출처 표시)
    schema_verified: true
    columns:
      - {name: 날짜, dtype: date, desc: baseDate}
      - {name: 노선명, dtype: str, desc: routeName (예 888-2)}
      - {name: 노선상세, dtype: str, desc: routeSubName (예 888-2(천지연폭포~동문로터리))}
      - {name: 승하차구분, dtype: str, desc: 승차/환승 (moveType)}
      - {name: 요금구분, dtype: str, desc: 일반/기타 등 (priceType)}
      - {name: 결제구분, dtype: str, desc: 카드 등 (payType)}
      - {name: 이용자수, dtype: int, desc: 교통카드 기준 (userCount)}
    rename:
      baseDate: 날짜
      routeName: 노선명
      routeSubName: 노선상세
      moveType: 승하차구분
      priceType: 요금구분
      payType: 결제구분
      userCount: 이용자수
    notes: >-
      노선별 하루 버스 이용자 수(교통카드 기준). 한 행은 날짜·노선·승하차구분(승차/환승)·요금구분·결제구분 조합이라 하루에 약
      2천 건이다(1주 약 1.4만 건 = 140회 호출로 약 1분, 1개월 약 6만 건 = 600회 호출로 수 분). 한 번에 1개월 이내로 요청하고,
      승차만 볼 때는 moveType=승차 로 거른다. 노선명(routeName)으로는 걸러지지 않는다. 노선별 합계는 요금구분·결제구분을 모두
      더해 구한다. 갱신이 빨라 약 2일 전 자료까지 있다. 정류소별 자료(bus_stop_daily_users, No.725)는 API ID 가 없어 샘플만
      있으므로 실제 버스 이용 변화는 이 데이터로 본다. 기간은 하루씩 나눠 받으며, 허브에 자료가 없는 날(예 2025-03 중 6일)과
      승차 0명인 날이 있을 수 있으니 결과에 적힌 날짜를 빼고 분석한다. 노선상세에 '(가상)'이 붙은 노선(예 888-8 차고지)은
      실제 운행 노선이 아닐 수 있다. 2026-11-07 사용자 PC 의 check-api --deep 으로 실제 응답을 확인했다.

  - id: bus_stops
    catalog_no: 726
    name: 버스 정류소 기본 정보
    category: 교통, 안전
    provider: 제주특별자치도 (제주데이터허브)
    source_url: https://www.jejudatahub.net
    access: api
    api_id: DD11ab6a6t11D16baaa1a2tD26ata161
    api_params: {}
    filter_params:
      stationName: 정류소 이름 (전체 이름이 같아야 함, 예 제주시청)
    file_glob: "*정류소*기본*.csv;bus_stops*.csv"
    sample_file: bus_stops_sample.csv
    update: "2019-04-01 ~ (일 단위 자동갱신)"
    license: 제주데이터허브 이용약관 (출처 표시)
    schema_verified: true
    columns:
      - {name: 정류소ID, dtype: str, desc: stationId}
      - {name: 정류소유형, dtype: str, desc: stationType (예 기타)}
      - {name: 정류소명, dtype: str, desc: stationName}
      - {name: 정류소주소, dtype: str, desc: stationAddress (예 서귀포시 표선면 세화리)}
      - {name: 지역정보, dtype: str, desc: localInfo (가까운 건물 등)}
