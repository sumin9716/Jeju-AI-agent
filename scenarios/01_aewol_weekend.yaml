id: aewol_weekend
title: 애월읍 주말·평일 방문자 비교 (생활권 진단, 대표 시나리오)
datasets: [floating_population_emd]
questions:
  - "애월읍은 주말과 평일 중 언제 방문자가 더 많아? 연령대별로도 비교해줘"
  - "방문자가 가장 많은 달과 가장 적은 달은 언제야? 차트로 보여줘"
  - "지금까지 내용을 보고서로 정리해줘"
expect:
  - 주말/평일 일평균 방문자수 비교표
  - 연령대별 차트 1개 이상, 월별 추세 차트 1개
  - 보고서 HTML 1개 (샘플 데이터 경고 포함)
