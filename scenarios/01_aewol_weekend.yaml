id: aewol_weekend
title: 애월읍 주말·평일 방문자 비교 (생활권 진단, 대표 시나리오)
datasets: [floating_population_emd]
# 실데이터 재현을 위해 기간을 고정한다 (2026-11-07 기준 가장 최근 데이터가 2026-08-31).
questions:
  - "2026년 8월 애월읍은 주말과 평일 중 언제 방문자가 더 많았어? 연령대별로도 비교하고 보고서로 정리해줘"
  - "2025년 9월부터 2026년 8월까지 애월읍 방문자가 가장 많은 달과 가장 적은 달은 언제야? 차트로 보여줘"
  - "지금까지 내용을 보고서로 정리해줘"
expect:
  - 주말/평일 일평균 방문자수 비교표와 연령대별 증가율
  - 연령대별 차트 1개 이상, 월별 추세 차트 1개
  - 보고서 HTML 1개 (실데이터면 출처 Open API, 샘플이면 경고 포함)
  - "2026-11-07 실데이터 결과(첫 질문): 주말이 평일보다 약 25% 많음, 토요일 최다, 6단계·53초"

