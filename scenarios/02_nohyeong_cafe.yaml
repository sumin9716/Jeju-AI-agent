id: nohyeong_cafe
title: 노형동 카페 창업 상권 진단 (유동인구 + 음식점 인허가 + 카드)
datasets: [floating_population_emd, restaurants, card_domestic_tourist]
questions:
  - "제주시 노형동에서 카페를 열려고 해. 유동인구(거주·근무·방문)와 음식점 현황을 분석해줘"
  - "노형동 카페는 얼마나 오래 영업하다 폐업하는 편이야? 다른 읍면동과 비교해줘"
  - "카드 데이터로 노형동에서 식음료 소비가 많은 연령대와 성별을 알려줘. 기간이 다르면 그 점도 설명해줘"
  - "예비창업자가 볼 수 있게 보고서로 정리해줘"
expect:
  - 거주/근무/방문 인구 구성 요약
  - 카페 폐업률·영업 기간 비교표
  - 카드 데이터 기간(2017~2018)이 유동인구(2024)와 다르다는 한계 명시
