id: rain_bus
title: 비 오는 날 버스 이용 변화 (교통 × 기상 결합)
datasets: [bus_route_daily_users, daily_weather, weather_stations]
questions:
  - "최근 한 달 동안 비 오는 날에는 버스 승차가 얼마나 줄었어? 제주 관측소 강수량 기준으로 노선별로 알려줘"
  - "비 오는 날 승차가 가장 많이 줄어드는 노선 10개를 차트로 보여주고 보고서로 정리해줘"
expect:
  - 비 온 날/안 온 날 노선별 하루 평균 승차 비교 (평일·주말 구분)
  - 데이터의 가장 최근 날짜를 기준으로 '최근 한 달'을 정하고 실제 기간을 밝힘 (노선별 자료는 하루 약 2천 건이라 한 달이 적당)
  - 같은 기간의 실제 기상 자료가 없으면 그 사실을 밝히고 날씨와 결합한 결론을 내지 않음
  - 감소율 상위 10개 노선 차트와 보고서 1개
  - 정류소별 자료(No.725)는 API 가 없어 노선별 자료(No.724)로 분석한다는 점 명시
