id: tourism_recovery
title: 코로나 이후 입도객 회복과 관광지 방문 (관광)
datasets: [visitors_by_purpose, tourist_spots_domestic]
questions:
  - "제주 입도객은 2022년 이후 어떻게 달라졌어? 개별여행·패키지 같은 구분별로 1~7월끼리 비교해줘"
  - "성산읍 쪽 관광지 중 방문객이 가장 많은 곳과 성수기는 언제야?"
  - "보고서로 정리해줘"
expect:
  - 연도별·구분별 입도객 비교 차트 (실제 No.755 는 2021-08 ~ 2025-07, 내·외국인 구분 없음)
  - 구분의 고유값을 먼저 확인하고, 여행형태와 방문목적이 섞여 있으면 같은 성격끼리만 더함
  - 관광지별 월별 유입자 상위 비교
  - 보고서 1개
